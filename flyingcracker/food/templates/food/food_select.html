<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6 pt-4 border-t">
    <div>
        <label class="block text-xs font-medium text-gray-500 mb-1">Recipes</label>
        <select onchange="if(this.value)window.location=this.value" class="w-full border rounded px-2 py-1 text-sm">
            <option value="">Select a recipe</option>
            {% for item in recipe_list %}
            <option value="{% url 'food:recipe-detail' recipe_type=recipe_type slug=item.slug %}">{{ item.title }}</option>
            {% endfor %}
        </select>
    </div>
    <div>
        <label class="block text-xs font-medium text-gray-500 mb-1">Ingredients</label>
        <select onchange="if(this.value)window.location=this.value" class="w-full border rounded px-2 py-1 text-sm">
            <option value="">Select an ingredient</option>
            {% for item in foodstuff_list %}
            <option value="{% url 'food:ingredient-detail' recipe_type=recipe_type slug=item.slug %}">{{ item.title }}</option>
            {% endfor %}
        </select>
    </div>
    <div>
        <label class="block text-xs font-medium text-gray-500 mb-1">Categories</label>
        <select onchange="if(this.value)window.location=this.value" class="w-full border rounded px-2 py-1 text-sm">
            <option value="">Select a category</option>
            {% for item in category_list %}
            <option value="{% url 'food:category-detail' recipe_type=recipe_type slug=item.slug %}">{{ item.title }}</option>
            {% endfor %}
        </select>
    </div>
</div>
