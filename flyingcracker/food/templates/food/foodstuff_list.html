{% extends "cocktail.html" %}

{% block body %}
<h2 class="text-xl font-semibold mb-4">All {{ recipe_type|capfirst }} Ingredients</h2>

{% if all_foodstuff %}
<div class="columns-2 md:columns-3 gap-4 text-sm">
    {% for foodstuff in all_foodstuff %}
    <a href="{% url 'food:ingredient-detail' recipe_type=recipe_type slug=foodstuff.slug %}" class="block py-0.5 text-blue-600 hover:underline">{{ foodstuff }}</a>
    {% endfor %}
</div>
{% else %}
<p class="text-gray-500">No ingredients in the database.</p>
{% endif %}

<div class="mt-6">
    <a href="{% url 'food:recipe-list' recipe_type=recipe_type %}" class="text-blue-600 hover:underline">All {{ recipe_type|capfirst }} Recipes</a>
</div>
{% endblock %}
